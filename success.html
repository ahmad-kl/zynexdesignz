<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent - Zynex Designing Hub</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        
        .success-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background-color: #0f0f1b; 
            color: #fff;
            padding: 20px;
        }
        .success-icon {
            font-size: 80px;
            color: #4caf50; 
            margin-bottom: 20px;
            animation: popIn 0.5s ease-out;
        }
        .success-container h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        .success-container p {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 30px;
            max-width: 500px;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="success-container">
        <i class="fas fa-check-circle success-icon"></i>
        <h1>Message Sent Successfully!</h1>
        <p>Thank you for reaching out to Zynex Designing Hub. Our team will get back to you within 24 hours.</p>
        <a href="index.html" class="btn glow-btn">Back to Home <i class="fas fa-home"></i></a>
    </div>

</body>
</html>
